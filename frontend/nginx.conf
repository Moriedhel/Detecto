# Serves the built React app and proxies /api/* to the FastAPI backend container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Video uploads (backend limit: DETECTO_MAX_VIDEO_MB, default 200 MB)
    client_max_body_size 210m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: /api/history -> http://backend:8000/history
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # stream large video uploads straight through
        proxy_read_timeout 300s;
    }

    # Hashed build assets can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (e.g. /history) load index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
